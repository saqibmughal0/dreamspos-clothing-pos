version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dreamspos-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dreamspos
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: dreamspos-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/dreamspos
      JWT_SECRET: dreamspos-production-super-secret-jwt-key-32-chars
      JWT_REFRESH_SECRET: dreamspos-production-super-secret-refresh-key
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: dreamspos-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mysql_data:
